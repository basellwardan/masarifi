# Builds an unsigned masarifi.ipa on a free GitHub macOS machine.
# Install it on an iPhone with Sideloadly (it signs the app with your Apple ID).
# Run it from the Actions tab ("Run workflow") or by pushing to main.
name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Liquid Glass needs the iOS 26 SDK (Xcode 26): the native glass tab bar
      # and the system's share sheet, alerts and keyboard all depend on it.
      - name: Use Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "::error::No Xcode 26 on this runner"; ls /Applications | grep -i xcode; exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build the web app
        run: npm run build

      - name: Sync into the iOS project (runs pod install)
        run: npx cap sync ios

      - name: Archive (unsigned)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || exit ${PIPESTATUS[0]}

      - name: Package masarifi.ipa
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/masarifi.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/masarifi.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: masarifi-ipa
          path: masarifi.ipa
          retention-days: 30

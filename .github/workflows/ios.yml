# Builds the native SwiftUI iPhone app (ios-native/) into an unsigned
# masarifi.ipa on a free GitHub macOS machine, after running its tests.
# Install it on an iPhone with Sideloadly (it signs the app with your Apple ID).
# Run it from the Actions tab ("Run workflow") or by pushing to main.
name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios-native
    steps:
      - uses: actions/checkout@v4

      # Liquid Glass needs the iOS 26 SDK (Xcode 26)
      - name: Use Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "::error::No Xcode 26 on this runner"; ls /Applications | grep -i xcode; exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Test (voice parser + money formatting)
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          ios = sorted([k for k in d if 'iOS' in k], key=lambda k: [int(x) for x in k.split('iOS-')[-1].split('-')])
          for k in reversed(ios):
              for dev in d[k]:
                  if dev['name'].startswith('iPhone'):
                      print(dev['udid']); sys.exit()
          ")
          echo "Simulator: $SIM"
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcodebuild test -project Masarifi.xcodeproj -scheme Masarifi \
            -destination "id=$SIM" -quiet \
            CODE_SIGNING_ALLOWED=NO

      # Launch the debug build in the simulator with sample data and take a
      # screenshot of every screen, to compare with the Android build.
      - name: Screenshots
        continue-on-error: true
        run: |
          xcodebuild build -project Masarifi.xcodeproj -scheme Masarifi -configuration Debug             -destination "id=$SIM" -derivedDataPath "$RUNNER_TEMP/dd" -quiet CODE_SIGNING_ALLOWED=NO
          xcrun simctl boot "$SIM" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl status_bar "$SIM" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$SIM" "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Masarifi.app"
          mkdir -p "$GITHUB_WORKSPACE/shots"
          shot() {
            name=$1; shift
            xcrun simctl terminate "$SIM" com.masarifi.app 2>/dev/null || true
            xcrun simctl launch "$SIM" com.masarifi.app "$@"
            sleep 6
            xcrun simctl io "$SIM" screenshot "$GITHUB_WORKSPACE/shots/$name.png"
          }
          shot 1-home -uiDemo -uiTab 0
          shot 2-transactions -uiDemo -uiTab 1
          shot 3-stats -uiDemo -uiTab 2
          shot 4-settings -uiDemo -uiTab 3
          shot 6-voice -uiDemo -uiTab 0 -uiSheet voice
          shot 7-add -uiDemo -uiTab 0 -uiSheet add
          shot 8-month -uiDemo -uiTab 2 -uiSheet month
          shot 9-notifications -uiDemo -uiTab 0 -uiSheet notifications
          shot 10-welcome -uiWelcome
          shot 11-home-en -uiDemo -uiTab 0 -uiLang en
          shot 12-stats-en -uiDemo -uiTab 2 -uiLang en

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Archive (unsigned)
        run: |
          xcodebuild \
            -project Masarifi.xcodeproj \
            -scheme Masarifi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Masarifi.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Package masarifi.ipa
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Masarifi.xcarchive/Products/Applications/Masarifi.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/masarifi.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/masarifi.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: masarifi-ipa
          path: masarifi.ipa
          retention-days: 30
